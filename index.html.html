<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>顶峰收益账本 V3.4 小数修正版</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{min-height:100vh;padding:15px;display:flex;justify-content:center;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#080808;color:#ffeeb0}body.gold{--main:#c9a84c;--light:#ffeeb0;--bg:#080808;--card:#111}body.jade{--main:#23c997;--light:#d0fff2;--bg:#031710;--card:#08271d}body.blue{--main:#4da3ff;--light:#d8ecff;--bg:#061326;--card:#0b203d}body.purple{--main:#b46cff;--light:#efd7ff;--bg:#12051d;--card:#221035}body.black{--main:#eee;--light:#fff;--bg:#000;--card:#080808}body.rose{--main:#ff8fa3;--light:#ffe0e7;--bg:#1b080d;--card:#2a1018}body.ocean{--main:#20d5ff;--light:#d9f8ff;--bg:#03151f;--card:#082938}body.silver{--main:#ddd;--light:#fff;--bg:#111;--card:#222}body{background:var(--bg);color:var(--light)}.wrap{width:100%;max-width:440px}.card{position:relative;overflow:hidden;width:100%;padding:24px 18px;border-radius:30px;border:1px solid var(--main);background:linear-gradient(160deg,color-mix(in srgb,var(--main) 15%,transparent),transparent 35%),var(--card);box-shadow:0 20px 80px color-mix(in srgb,var(--main) 30%,transparent)}.inner{position:absolute;inset:6px;border-radius:25px;border:1px solid #ffffff19;pointer-events:none}.title{text-align:center;font-size:30px;font-weight:900;letter-spacing:5px}.sub{text-align:center;margin-top:8px;font-size:12px;letter-spacing:3px;color:var(--main)}.theme{display:flex;gap:5px;margin:20px 0;flex-wrap:wrap}.theme button,.month button,.clear{border:1px solid var(--main);color:var(--light);background:#ffffff08;border-radius:18px;cursor:pointer}.theme button{flex:1;min-width:60px;height:34px;font-size:11px}.stats{display:flex;gap:10px}.stat{flex:1;padding:15px 5px;border-radius:16px;text-align:center;border:1px solid color-mix(in srgb,var(--main) 25%,transparent);background:#ffffff08}.label{font-size:11px;color:var(--main)}.value{margin-top:8px;font-size:20px;font-weight:900;overflow-wrap:anywhere}.month{margin:22px 0;display:flex;align-items:center;justify-content:space-between}.month button{width:42px;height:36px;font-size:25px}.month span{font-size:20px;font-weight:900}.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;margin-bottom:8px;font-weight:bold;opacity:.8}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{height:58px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;cursor:pointer;border:1px solid color-mix(in srgb,var(--main) 20%,transparent);background:#ffffff08;min-width:0}.day.active{border-color:var(--main);background:color-mix(in srgb,var(--main) 12%,transparent)}.day-num{font-size:12px;font-weight:bold;line-height:1;margin-bottom:2px;opacity:.7}.day input{width:95%;height:22px;border:0;outline:0;background:none;color:var(--light);text-align:center;font-size:12px;font-weight:bold;min-width:0}.day input::placeholder{font-size:10px;color:#ffffff55}.note-icon{position:absolute;right:3px;top:2px;font-size:10px}.note-box,.calculator,.panel{margin-top:18px;padding:14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--main) 30%,transparent);background:#ffffff08}.note-title,.calc-title{font-weight:bold;margin-bottom:10px;color:var(--light)}.note-item{font-size:12px;line-height:22px;color:var(--main);overflow-wrap:anywhere}.product-calculator{margin:16px 0;padding:18px 14px;border:1px solid var(--main);border-radius:14px;background:#ffffff08;color:var(--light);text-align:left}.product-calculator h3{text-align:center;font-size:17px;color:var(--main);margin-bottom:18px}.calc-field{margin-bottom:14px}.calc-field label{display:block;margin-bottom:6px;font-size:13px}.calc-field input,.calc-field select{display:block;width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--main);border-radius:8px;background:#080808;color:var(--light);font-size:15px}.calc-field select{margin-bottom:8px}.calc-field input:focus,.calc-field select:focus{outline:2px solid var(--main);outline-offset:2px}.calc-field input[readonly]{opacity:.85}#calcBtn,.panel button{width:100%;min-height:44px;border:0;border-radius:10px;background:var(--main);color:#080808;font-size:15px;font-weight:bold;cursor:pointer}.calc-result{margin-top:16px;padding:12px;border-radius:8px;background:#0006;line-height:1.8;font-size:13px;overflow-wrap:anywhere}.calc-result div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.calc-result strong{color:var(--main);text-align:right}.calc-tip{text-align:center;font-size:11px;opacity:.7;margin-top:10px}.buttons{display:flex;gap:12px;margin-top:20px}.buttons button{flex:1;height:48px;border-radius:16px;font-size:15px;font-weight:bold;cursor:pointer;border:0}.export{background:var(--main);color:#080808}.clear{background:transparent}.brand{margin-top:20px;text-align:center;font-size:11px;letter-spacing:5px;opacity:.3}.mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;z-index:999}.panel{width:85%;max-width:380px;background:var(--card)}.panel h3{text-align:center;margin-bottom:15px;font-size:16px}.panel textarea{width:100%;height:130px;border-radius:12px;padding:10px;font-size:14px;resize:none;outline:none;background:#000;color:var(--light);border:1px solid var(--main)}.panel button{margin-top:12px}.preview-overlay{position:fixed;inset:0;background:#000f;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:5px}.preview-overlay img{max-width:100%;max-height:88vh;object-fit:contain}.preview-tip{color:#fff;font-size:13px;font-weight:bold;margin:8px}.preview-close{background:#ffffff15;color:#fff;border:1px solid #ffffff30;padding:8px 20px;border-radius:15px;cursor:pointer}@media(max-width:380px){body{padding:8px}.card{padding:20px 12px}.grid{gap:4px}.day{height:54px}.value{font-size:17px}.title{font-size:25px}}
</style></head>
<body class="gold"><div class="wrap"><div class="card" id="capture"><div class="inner"></div><div class="title">顶峰收益账本</div><div class="sub">财富记录 · 节点共建</div>
<div class="theme" id="themeBtns"><button onclick="changeTheme('gold')">鎏金</button><button onclick="changeTheme('jade')">翡翠</button><button onclick="changeTheme('blue')">星耀</button><button onclick="changeTheme('purple')">紫晶</button><button onclick="changeTheme('black')">黑钻</button><button onclick="changeTheme('rose')">玫瑰</button><button onclick="changeTheme('ocean')">深海</button><button onclick="changeTheme('silver')">银灰</button></div>
<div class="stats"><div class="stat"><div class="label">累计收益</div><div class="value" id="sum">$0</div></div><div class="stat"><div class="label">收益天数</div><div class="value" id="days">0</div></div><div class="stat"><div class="label">日均收益</div><div class="value" id="avg">$0</div></div></div>
<div class="month"><button id="prev">‹</button><span id="ym"></span><button id="next">›</button></div><div class="week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div class="grid" id="grid"></div>
<div class="note-box"><div class="note-title">📝 日期备注</div><div id="noteList" class="note-item">暂无备注</div></div>
<div class="product-calculator" id="productCalculator"><h3>💎 USDT 产品组合收益计算器</h3>
<div class="calc-field"><label for="productA">第一个产品</label><select id="productA"><option value="product1">节点精选包（每日 0.5%）</option><option value="product2">新手包（每日 1%）</option><option value="product3">稳健包（每日 0.8%）</option><option value="product4">进阶包（每日 0.9%）</option><option value="product5">进阶II包（每日 1.1%）</option><option value="custom">自定义产品</option></select><label for="nameA">自定义名称（选填）</label><input id="nameA" type="text" placeholder="自定义名称（选填）"><label for="amountA">参与金额（USDT）</label><input id="amountA" type="number" min="0" step="any" placeholder="例如：1000.25"><label for="rateA">每日收益率（%）</label><input id="rateA" type="number" min="0" step="any" placeholder="每日收益率"></div>
<div class="calc-field"><label for="daysA">持有天数</label><input id="daysA" type="number" min="0" step="1" placeholder="请输入持有天数"></div>
<div class="calc-field"><label for="productB">第二个产品</label><select id="productB"><option value="product1">节点精选包（每日 0.5%）</option><option value="product2">新手包（每日 1%）</option><option value="product3" selected>稳健包（每日 0.8%）</option><option value="product4">进阶包（每日 0.9%）</option><option value="product5">进阶II包（每日 1.1%）</option><option value="custom">自定义产品</option></select><label for="nameB">自定义名称（选填）</label><input id="nameB" type="text" placeholder="自定义名称（选填）"><label for="amountB">参与金额（USDT）</label><input id="amountB" type="number" min="0" step="any" placeholder="例如：2000.50"><label for="rateB">每日收益率（%）</label><input id="rateB" type="number" min="0" step="any" placeholder="每日收益率"><label for="daysB">持有天数</label><input id="daysB" type="number" min="0" step="1" placeholder="请输入持有天数"></div>
<button type="button" id="calcBtn">计算组合收益</button><div class="calc-result"><div>第一个产品收益：<strong id="profitA">0.00 USDT</strong></div><div>第二个产品收益：<strong id="profitB">0.00 USDT</strong></div><div>总投入金额：<strong id="combinedAmount">0.00 USDT</strong></div><div>总预估收益：<strong id="combinedProfit">0.00 USDT</strong></div><div>本息合计：<strong id="combinedTotal">0.00 USDT</strong></div></div><div class="calc-tip">固定日收益 · 不复利 · 仅供计算参考</div></div>
<div class="buttons" id="btnArea"><button class="export" id="export">📸 高清导出</button><button class="clear" id="clear">清空</button></div><div class="brand">D I N G F E N G · W E A L T H</div></div></div>
<div class="preview-overlay" id="previewOverlay"><img id="previewImage" src="" alt="顶峰收益账本"><div class="preview-tip">⬇️ 长按图片保存到相册</div><button class="preview-close" id="closePreview">关 闭</button></div><div class="mask" id="mask"><div class="panel"><h3 id="noteTitle">日期备注</h3><textarea id="noteText" placeholder="输入当天备注"></textarea><button id="saveNote">保存备注</button></div></div>
<script>
const themes=['gold','jade','blue','purple','black','rose','ocean','silver'];function changeTheme(t){document.body.className=themes.includes(t)?t:'gold';try{localStorage.setItem('ps_theme',document.body.className)}catch(e){}}try{changeTheme(localStorage.getItem('ps_theme')||'gold')}catch(e){}
let now=new Date(),income={},notes={},currentDay=null;try{income=JSON.parse(localStorage.getItem('ps_income')||'{}')}catch(e){}try{notes=JSON.parse(localStorage.getItem('ps_notes')||'{}')}catch(e){}
function getKey(){return now.getFullYear()+'-'+now.getMonth()}function money(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function render(){let y=now.getFullYear(),m=now.getMonth();document.getElementById('ym').textContent=y+'年'+(m+1)+'月';let grid=document.getElementById('grid');grid.innerHTML='';let first=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate(),key=getKey();if(!income[key])income[key]={};if(!notes[key])notes[key]={};for(let i=0;i<first;i++){let e=document.createElement('div');e.className='day';e.style.visibility='hidden';grid.appendChild(e)}for(let d=1;d<=total;d++){let box=document.createElement('div');box.className='day';if(income[key][d]!==undefined&&income[key][d]!==null&&income[key][d]!=='')box.classList.add('active');if(notes[key][d]){let ic=document.createElement('span');ic.className='note-icon';ic.textContent='📝';box.appendChild(ic)}let num=document.createElement('div');num.className='day-num';num.textContent=d;box.appendChild(num);let inp=document.createElement('input');inp.type='text';inp.inputMode='decimal';inp.setAttribute('autocomplete','off');inp.setAttribute('pattern','[0-9]*[.,]?[0-9]*');inp.placeholder='0';inp.value=income[key][d]??'';inp.setAttribute('aria-label',d+'日收益');inp.addEventListener('input',function(){let v=this.value.replace(/,/g,'.').replace(/[^\d.]/g,'');let p=v.indexOf('.');if(p!==-1)v=v.slice(0,p+1)+v.slice(p+1).replace(/\./g,'');this.value=v;if(v!==''&&v!=='.'){income[key][d]=Number(v);box.classList.add('active')}else{delete income[key][d];box.classList.remove('active')}try{localStorage.setItem('ps_income',JSON.stringify(income))}catch(e){}calc()});inp.addEventListener('click',e=>e.stopPropagation());box.addEventListener('click',()=>openNote(d));box.appendChild(inp);grid.appendChild(box)}calc();showNotes()}
function calc(){let key=getKey(),sum=0,days=0;for(let i in income[key]||{}){if(income[key][i]!==''&&income[key][i]!==null&&Number.isFinite(Number(income[key][i]))){sum+=Number(income[key][i]);if(Number(income[key][i])!==0)days++}}document.getElementById('sum').textContent='$'+money(sum);document.getElementById('days').textContent=days;document.getElementById('avg').textContent='$'+money(days?sum/days:0)}
function openNote(day){currentDay=day;let key=getKey();document.getElementById('noteTitle').textContent=(now.getMonth()+1)+'月'+day+'日备注';document.getElementById('noteText').value=(notes[key]&&notes[key][day])||'';document.getElementById('mask').style.display='flex'}function showNotes(){let key=getKey(),box=document.getElementById('noteList'),html='';for(let d in notes[key]||[])html+='<div>📝 '+d+'日：'+escapeHtml(notes[key][d])+'</div>';box.innerHTML=html||'<span style="opacity:.5">暂无备注</span>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('saveNote').onclick=function(){let key=getKey(),txt=document.getElementById('noteText').value.trim();if(!notes[key])notes[key]={};if(txt)notes[key][currentDay]=txt;else delete notes[key][currentDay];try{localStorage.setItem('ps_notes',JSON.stringify(notes))}catch(e){}document.getElementById('mask').style.display='none';render()};document.getElementById('mask').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.style.display='none'};document.getElementById('prev').onclick=()=>{now.setDate(1);now.setMonth(now.getMonth()-1);render()};document.getElementById('next').onclick=()=>{now.setDate(1);now.setMonth(now.getMonth()+1);render()};document.getElementById('clear').onclick=()=>{if(confirm('确定清空本月收益？')){delete income[getKey()];try{localStorage.setItem('ps_income',JSON.stringify(income))}catch(e){}render()}};
const rates={product1:.5,product2:1,product3:.8,product4:.9,product5:1.1};function setupProduct(p){let sel=document.getElementById('product'+p),rate=document.getElementById('rate'+p),name=document.getElementById('name'+p);function update(){let custom=sel.value==='custom';rate.readOnly=!custom;rate.value=custom?'':rates[sel.value];name.placeholder=custom?'请输入自定义产品名称':'自定义名称（选填）'}sel.addEventListener('change',()=>{update();resetResults()});update()}setupProduct('A');setupProduct('B');function fmtUSDT(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' USDT'}function readProduct(p){let sel=document.getElementById('product'+p),amountText=document.getElementById('amount'+p).value.trim(),rateText=document.getElementById('rate'+p).value.trim(),daysText=document.getElementById('days'+p).value.trim(),amount=Number(amountText),rate=Number(rateText),days=Number(daysText);if(amountText===''||rateText===''||daysText===''||![amount,rate,days].every(Number.isFinite)||amount<0||rate<0||days<0||!Number.isInteger(days))throw Error('请检查两个产品的金额、收益率和持有天数。金额和收益率可填写小数，天数须为非负整数。');let name=sel.value==='custom'?(document.getElementById('name'+p).value.trim()||'自定义产品'+p):sel.options[sel.selectedIndex].text;return{name,amount,rate,days,profit:amount*rate/100*days}}function resetResults(){['profitA','profitB','combinedAmount','combinedProfit','combinedTotal'].forEach(id=>document.getElementById(id).textContent='0.00 USDT')}document.getElementById('calcBtn').onclick=function(){try{let a=readProduct('A'),b=readProduct('B'),totalAmount=a.amount+b.amount,totalProfit=a.profit+b.profit;document.getElementById('profitA').textContent=fmtUSDT(a.profit);document.getElementById('profitB').textContent=fmtUSDT(b.profit);document.getElementById('combinedAmount').textContent=fmtUSDT(totalAmount);document.getElementById('combinedProfit').textContent=fmtUSDT(totalProfit);document.getElementById('combinedTotal').textContent=fmtUSDT(totalAmount+totalProfit)}catch(e){alert(e.message)}};['productA','productB','nameA','nameB','amountA','amountB','rateA','rateB','daysA','daysB'].forEach(id=>{document.getElementById(id).addEventListener('input',resetResults);document.getElementById(id).addEventListener('change',resetResults)});
document.getElementById('closePreview').onclick=()=>document.getElementById('previewOverlay').style.display='none';document.getElementById('previewOverlay').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.style.display='none'};
document.getElementById('export').onclick=async function(){let btn=this;btn.disabled=true;btn.textContent='⏳ 正在生成';let theme=document.getElementById('themeBtns'),buttons=document.getElementById('btnArea'),product=document.getElementById('productCalculator'),old=[theme.style.display,buttons.style.display,product.style.display];theme.style.display='none';buttons.style.display='none';product.style.display='none';try{let canvas=await html2canvas(document.getElementById('capture'),{backgroundColor:null,scale:2,useCORS:true});theme.style.display=old[0];buttons.style.display=old[1];product.style.display=old[2];let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='顶峰收益账本_'+now.getFullYear()+'年'+(now.getMonth()+1)+'月.png';a.click()}catch(e){alert('导出失败：'+e.message)}finally{theme.style.display=old[0];buttons.style.display=old[1];product.style.display=old[2];btn.disabled=false;btn.textContent='📸 高清导出'}};
render();
</script></body></html>
